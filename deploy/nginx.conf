# nginx reverse proxy for Steel Tide: TLS termination, HTTP/2, WebSocket upgrade.
# Replace play.example.com and the certificate paths, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/steel-tide
#   sudo ln -s /etc/nginx/sites-available/steel-tide /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# App environment: HOST=127.0.0.1 PORT=3000 TRUST_PROXY=1 PUBLIC_URL=https://play.example.com

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream steel_tide {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name play.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name play.example.com;

  ssl_certificate     /etc/letsencrypt/live/play.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/play.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # The app already sends compressed, cache-controlled responses: pass them through.
  gzip off;
  client_max_body_size 16k;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For   $remote_addr;

  # Game socket. Without the Upgrade/Connection headers the handshake fails;
  # the long read timeout keeps idle lobbies connected (the app pings every 15 s).
  location = /ws {
    proxy_pass http://steel_tide;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }

  # Health check: reachable from the proxy host and monitors only.
  location = /healthz {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://steel_tide;
  }

  location / {
    proxy_pass http://steel_tide;
    proxy_set_header Connection "";
  }
}
