<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16191b">
<title>Steel Tide</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2323282c'/%3E%3Cpath d='M6 20l10-11 10 11' fill='none' stroke='%23e8b72c' stroke-width='4' stroke-linejoin='miter'/%3E%3Cpath d='M6 27l10-11 10 11' fill='none' stroke='%23c8322f' stroke-width='4' stroke-linejoin='miter'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Shared icon set: flat, square-cut, same stroke weight everywhere. -->
<svg width="0" height="0" class="sprite-sheet" aria-hidden="true">
  <symbol id="i-globe" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 10h15M10 2.5c-3.4 3.6-3.4 11.4 0 15M10 2.5c3.4 3.6 3.4 11.4 0 15" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-sound" viewBox="0 0 20 20"><path d="M3 7.5h3.5L11 4v12l-4.5-3.5H3z" fill="currentColor"/><path d="M13.5 7a4.2 4.2 0 010 6M15.8 4.8a7.4 7.4 0 010 10.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></symbol>
  <symbol id="i-mute" viewBox="0 0 20 20"><path d="M3 7.5h3.5L11 4v12l-4.5-3.5H3z" fill="currentColor"/><path d="M13.5 7.5l5 5M18.5 7.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></symbol>
  <symbol id="i-exit" viewBox="0 0 20 20"><path d="M8 3H3.5v14H8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/><path d="M8 10h8.5M13 6l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></symbol>
  <symbol id="i-keys" viewBox="0 0 20 20"><rect x="1.9" y="4.9" width="16.2" height="10.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 8h1.6M8.2 8h1.6M11.4 8H13M14.6 8h.6M5 11.8h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></symbol>
  <symbol id="i-gear" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.2 2.2M13.5 13.5l2.2 2.2M4.3 15.7l2.2-2.2M13.5 6.5l2.2-2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></symbol>
  <!-- Skill icons: one glyph per skill, same grid and stroke. -->
  <symbol id="i-nuke" viewBox="0 0 24 24"><path d="M4 9.5a8 4.6 0 0116 0c0 2-2.6 3-5 3.2L16 20H8l1-7.3C6.6 12.5 4 11.5 4 9.5z" fill="currentColor"/><path d="M3 22h18" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-turret" viewBox="0 0 24 24"><path d="M5 20h14l-2-6H7z" fill="currentColor"/><rect x="8" y="9" width="8" height="5" fill="currentColor"/><path d="M12 11.5L21 5" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/></symbol>
  <symbol id="i-barricade" viewBox="0 0 24 24"><path d="M2 9h20v6H2z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15l4-6M10 15l4-6M15 15l4-6" stroke="currentColor" stroke-width="2"/><path d="M6 15v6M18 15v6M6 9V5M18 9V5" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-aegis" viewBox="0 0 24 24"><path d="M3 19a9 10 0 0118 0" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 19a5 6 0 0110 0M12 9v10M2 19h20" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3v3" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-suppress" viewBox="0 0 24 24"><path d="M12 21V10" stroke="currentColor" stroke-width="2.4"/><path d="M8 21h8" stroke="currentColor" stroke-width="2"/><path d="M7 10a5 5 0 0110 0M4 9a8 8 0 0116 0" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 15l4 2-4 2M21 15l-4 2 4 2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-wormhole" viewBox="0 0 24 24"><ellipse cx="6" cy="12" rx="3.5" ry="7" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="18" cy="12" rx="3.5" ry="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 9h8M8 15h8" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/><path d="M11 12h2" stroke="currentColor" stroke-width="2.4"/></symbol>
  <symbol id="i-guard" viewBox="0 0 24 24"><path d="M9 21l3-14 3 14z" fill="currentColor"/><circle cx="12" cy="5" r="2.6" fill="currentColor"/><path d="M5 5a7 7 0 000 8M19 5a7 7 0 010 8" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-mire" viewBox="0 0 24 24"><path d="M2 8h20M2 16h20" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3"/><path d="M3 12c2-3 4 3 6 0s4 3 6 0 4 3 6 0" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
  <symbol id="i-dominate" viewBox="0 0 24 24"><path d="M4 21v-8l8-6 8 6v8z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 15c1.5-2.4 6.500-2.400 8 0-1.500 2.400-6.500 2.400-8 0z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/><path d="M12 2v3M7 3l1.500 2.500M17 3l-1.500 2.500" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-pause" viewBox="0 0 20 20"><path d="M5 3.5h3.6v13H5zM11.4 3.5H15v13h-3.6z" fill="currentColor"/></symbol>
  <symbol id="i-play" viewBox="0 0 20 20"><path d="M5.5 3.2l11 6.8-11 6.8z" fill="currentColor"/></symbol>
  <symbol id="i-auto" viewBox="0 0 20 20"><path d="M15.6 6.2A6.6 6.6 0 103.6 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.9 1.8v5.4h-5.4z" fill="currentColor"/><path d="M4.4 13.8A6.6 6.6 0 0016.4 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"/></symbol>
  <symbol id="i-up" viewBox="0 0 20 20"><path d="M10 2.5l7.5 8H13V17H7v-6.5H2.5z" fill="currentColor"/></symbol>
  <symbol id="i-insignia" viewBox="0 0 48 48"><path d="M6 27l18-20 18 20" fill="none" stroke="#e8b72c" stroke-width="7"/><path d="M6 41l18-20 18 20" fill="none" stroke="#c8322f" stroke-width="7"/></symbol>
</svg>

<main id="home" class="screen">
  <div class="panel">
    <div class="panel-top">
      <span class="kicker" data-i18n="app.kicker"></span>
      <label class="lang">
        <svg class="ico"><use href="#i-globe"/></svg>
        <select class="lang-select" data-i18n-attr="aria-label:hud.language"></select>
      </label>
    </div>

    <div class="brand">
      <svg class="insignia" aria-hidden="true"><use href="#i-insignia"/></svg>
      <h1 class="logo" data-i18n="app.title"></h1>
    </div>
    <p class="tagline" data-i18n="app.tagline"></p>

    <div id="tut-prompt" class="tut-prompt hidden" role="note">
      <b data-i18n="tutorial.prompt.title"></b>
      <p data-i18n="tutorial.prompt.body"></p>
      <div class="tut-prompt-row">
        <button id="tut-prompt-start" class="btn small" type="button" data-i18n="tutorial.prompt.start"></button>
        <button id="tut-prompt-later" class="btn small ghost" type="button" data-i18n="tutorial.prompt.later"></button>
      </div>
    </div>

    <label class="field">
      <span data-i18n="home.callsign"></span>
      <input id="name" maxlength="16" autocomplete="off" spellcheck="false">
    </label>

    <button id="btn-host" class="btn primary" data-i18n="home.host"></button>

    <div class="divider"><span data-i18n="home.orJoin"></span></div>

    <form id="join-form" class="join-row">
      <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false"
             data-i18n-attr="placeholder:home.codePlaceholder;aria-label:home.codeLabel">
      <button class="btn" type="submit" data-i18n="home.join"></button>
    </form>

    <div id="room-list" class="room-list"></div>

    <button id="btn-tutorial" class="btn wide" type="button"><span data-i18n="tutorial.menu"></span><small id="tut-progress"></small></button>
    <a class="btn ghost wide" href="armory.html" data-i18n="armory.open"></a>

    <details class="how">
      <summary data-i18n="how.title"></summary>
      <ul>
        <li><b data-i18n="how.send.title"></b> <span data-i18n="how.send.body"></span></li>
        <li><b data-i18n="how.amount.title"></b> <span data-i18n="how.amount.body"></span></li>
        <li><b data-i18n="how.upgrade.title"></b> <span data-i18n="how.upgrade.body"></span></li>
        <li><b data-i18n="how.fight.title"></b> <span data-i18n="how.fight.body"></span></li>
        <li><b data-i18n="how.skills.title"></b> <span data-i18n="how.skills.body"></span></li>
        <li><b data-i18n="how.win.title"></b> <span data-i18n="how.win.body"></span></li>
        <li><b data-i18n="how.keys.title"></b> <span data-i18n="how.keys.body"></span></li>
      </ul>
    </details>
  </div>
</main>

<main id="room" class="screen hidden">
  <div class="panel wide">
    <header class="room-head">
      <div>
        <small data-i18n="room.label"></small>
        <div class="room-code-row">
          <div id="room-code" class="room-code"></div>
          <button id="btn-copy-code" class="btn small" type="button" data-i18n="room.copyCode"></button>
        </div>
      </div>
      <div class="room-actions">
        <label class="lang">
          <svg class="ico"><use href="#i-globe"/></svg>
          <select class="lang-select" data-i18n-attr="aria-label:hud.language"></select>
        </label>
        <button id="btn-leave-room" class="btn ghost" data-i18n="room.leave"></button>
      </div>
    </header>

    <section class="invite">
      <small data-i18n="room.inviteTitle"></small>
      <div id="invite-links"></div>
    </section>

    <small id="players-title"></small>
    <ul id="players" class="players"></ul>

    <div id="host-controls" class="host-controls">
      <span data-i18n="room.addAI"></span>
      <button class="btn small" data-ai="easy" data-i18n="ai.easy"></button>
      <button class="btn small" data-ai="normal" data-i18n="ai.normal"></button>
      <button class="btn small" data-ai="hard" data-i18n="ai.hard"></button>
    </div>

    <label class="opt" id="opt-crates-row">
      <input type="checkbox" id="opt-crates">
      <span><b data-i18n="room.crates"></b><small data-i18n="room.cratesHint"></small></span>
    </label>

    <button id="btn-ready" class="btn ready" type="button"></button>
    <button id="btn-start" class="btn primary" data-i18n="room.start"></button>
    <p id="room-hint" class="hint"></p>
  </div>
</main>

<main id="game" class="screen hidden">
  <canvas id="gl" class="hidden"></canvas>
  <canvas id="cv"></canvas>

  <div id="loading" class="hidden" role="status" aria-live="polite">
    <div class="load-card">
      <div class="load-emblem" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
      <h2 id="load-title"></h2>
      <p id="load-sub"></p>
      <ol id="load-stages"></ol>
      <p id="load-wait"></p>
      <div class="load-bar" aria-hidden="true"><span></span></div>
      <div id="load-actions" class="hidden">
        <button id="load-retry" class="btn primary" type="button" data-i18n="loading.retry"></button>
        <button id="load-back" class="btn ghost" type="button"></button>
      </div>
    </div>
  </div>

  <div id="hud-top">
    <div id="hud-players"></div>
    <div class="hud-btns">
      <div id="ctl" class="ctl">
        <button id="btn-pause" class="btn tiny icon"><svg class="ico"><use href="#i-pause"/></svg></button>
        <select id="speed" class="speed-select" data-i18n-attr="title:hud.speed;aria-label:hud.speed"></select>
      </div>
      <label class="lang tiny" data-i18n-attr="title:hud.language">
        <svg class="ico"><use href="#i-globe"/></svg>
        <select class="lang-select" data-i18n-attr="aria-label:hud.language"></select>
      </label>
      <button id="btn-settings" class="btn tiny icon" data-i18n-attr="title:settings.open;aria-label:settings.open"><svg class="ico"><use href="#i-gear"/></svg></button>
      <button id="btn-keys" class="btn tiny icon" data-i18n-attr="title:keys.open;aria-label:keys.open"><svg class="ico"><use href="#i-keys"/></svg></button>
      <button id="btn-sfx" class="btn tiny icon"><svg class="ico"><use href="#i-sound"/></svg></button>
      <button id="btn-quit" class="btn tiny"><svg class="ico"><use href="#i-exit"/></svg><span id="quit-label"></span></button>
    </div>
  </div>

  <div id="info" class="hidden"></div>

  <div id="hud-bottom">
    <span class="hud-label" data-i18n="hud.send"></span>
    <div id="pct" class="seg">
      <button data-pct="0.25">25%</button>
      <button data-pct="0.5" class="on">50%</button>
      <button data-pct="0.75">75%</button>
      <button data-pct="1">100%</button>
    </div>
    <button id="btn-auto" class="btn tiny auto" data-i18n-attr="title:hud.autoTitle"><svg class="ico"><use href="#i-auto"/></svg><span data-i18n="hud.auto"></span></button>
    <button id="btn-auto-stop" class="btn tiny hidden"></button>
  </div>

  <div id="paused" class="hidden" role="status" aria-live="polite">
    <strong data-i18n="pause.title"></strong>
    <span id="paused-by"></span>
    <div class="paused-btns">
      <button id="pause-resume" class="btn tiny primary" data-i18n="pause.resume"></button>
      <button id="pause-settings" class="btn tiny" data-i18n="settings.open"></button>
      <button id="pause-leave" class="btn tiny ghost" data-i18n="hud.leave"></button>
    </div>
  </div>

  <div id="skillbar">
    <div id="skill-tip" class="hidden"></div>
    <div id="buffs"></div>
    <div id="skills"></div>
  </div>

  <div id="tut-pins" aria-hidden="true"></div>
  <aside id="tutorial" class="hidden" aria-live="polite"></aside>

  <div id="settings" class="hidden" role="dialog" aria-modal="true">
    <div class="panel">
      <h2 data-i18n="settings.title"></h2>
      <label class="field"><span data-i18n="settings.quality"></span>
        <select id="set-quality">
          <option value="high" data-i18n="settings.high"></option>
          <option value="medium" data-i18n="settings.medium"></option>
          <option value="low" data-i18n="settings.low"></option>
        </select>
      </label>
      <label class="opt"><input type="checkbox" id="set-webgl"><span><b data-i18n="settings.webgl"></b><small data-i18n="settings.webglHint"></small></span></label>
      <label class="opt"><input type="checkbox" id="set-effects"><span><b data-i18n="settings.effects"></b></span></label>
      <label class="opt"><input type="checkbox" id="set-shake"><span><b data-i18n="settings.shake"></b></span></label>
      <label class="opt"><input type="checkbox" id="set-flash"><span><b data-i18n="settings.flash"></b></span></label>
      <button id="settings-close" class="btn" data-i18n="settings.close"></button>
    </div>
  </div>

  <button id="btn-upgrade" class="hidden"><svg class="ico"><use href="#i-up"/></svg><span></span></button>
  <div id="banner" class="hidden"></div>

  <div id="keys" class="hidden" role="dialog" aria-modal="true">
    <div class="panel">
      <h2 data-i18n="keys.title"></h2>
      <dl class="keys-list">
        <div><dt><kbd>Q</kbd><kbd>E</kbd></dt><dd data-i18n="keys.cycle"></dd></div>
        <div><dt><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></dt><dd data-i18n="keys.move"></dd></div>
        <div><dt><kbd>Shift</kbd>+<kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></dt><dd data-i18n="keys.send"></dd></div>
        <div><dt><kbd>S</kbd></dt><dd data-i18n="keys.sendHover"></dd></div>
        <div><dt><kbd data-i18n="keys.shiftClick"></kbd></dt><dd data-i18n="keys.multi"></dd></div>
        <div><dt><kbd>A</kbd></dt><dd data-i18n="keys.pickAll"></dd></div>
        <div><dt><kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd></dt><dd data-i18n="keys.skills"></dd></div>
        <div><dt><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd></dt><dd data-i18n="keys.amount"></dd></div>
        <div><dt><kbd>U</kbd><kbd data-i18n="keys.space"></kbd></dt><dd data-i18n="keys.upgrade"></dd></div>
        <div><dt><kbd>R</kbd></dt><dd data-i18n="keys.auto"></dd></div>
        <div><dt><kbd>Del</kbd></dt><dd data-i18n="keys.autoStop"></dd></div>
        <div><dt><kbd>×</kbd></dt><dd data-i18n="keys.routeCancel"></dd></div>
        <div><dt><kbd>⇢</kbd></dt><dd data-i18n="keys.column"></dd></div>
        <div><dt><kbd>+</kbd><kbd>−</kbd><kbd>0</kbd></dt><dd data-i18n="keys.zoom"></dd></div>
        <div><dt><kbd>P</kbd></dt><dd data-i18n="keys.pause"></dd></div>
        <div><dt><kbd>[</kbd><kbd>]</kbd></dt><dd data-i18n="keys.speed"></dd></div>
        <div><dt><kbd>Esc</kbd></dt><dd data-i18n="keys.cancel"></dd></div>
        <div><dt><kbd>M</kbd></dt><dd data-i18n="keys.mute"></dd></div>
        <div><dt><kbd>H</kbd><kbd>?</kbd></dt><dd data-i18n="keys.help"></dd></div>
      </dl>
      <button id="keys-close" class="btn" data-i18n="keys.close"></button>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div class="panel">
      <h2 id="ov-title"></h2>
      <p id="ov-sub"></p>
      <div id="results" class="hidden">
        <div class="results-scroll"><table id="results-table"></table></div>
        <small data-i18n="results.sortHint"></small>
      </div>
      <div class="ov-btns">
        <button id="ov-lobby" class="btn primary" data-i18n="over.backToRoom"></button>
        <button id="ov-watch" class="btn" data-i18n="over.keepWatching"></button>
        <button id="ov-leave" class="btn ghost" data-i18n="over.leave"></button>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="hidden" role="status"></div>
<button id="net" type="button" data-q="wait" disabled><span class="net-dot"></span><span id="net-label"></span></button>

<script type="module" src="js/main.js"></script>
</body>
</html>
